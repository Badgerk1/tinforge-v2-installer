name: Build macOS Installer

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [develop]

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup build environment
        shell: bash
        run: bash .github/workflows/common/setup-build-env.sh macos

      - name: Build installer
        shell: bash
        run: |
          mkdir -p .artifacts/logs
          python build-scripts/build_macos.py 2>&1 | tee .artifacts/logs/build-macos.log

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: |
            .artifacts/TinForge-v2.dmg
            .artifacts/logs/build-macos.log

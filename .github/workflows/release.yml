name: Release Coordinator

on:
  push:
    tags: ["v*", "V*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish (for manual runs)"
        required: true
        type: string

jobs:
  build_windows:
    permissions:
      contents: read
    uses: ./.github/workflows/build-windows.yml
    secrets: inherit

  build_macos:
    permissions:
      contents: read
    uses: ./.github/workflows/build-macos.yml
    secrets: inherit

  build_linux:
    permissions:
      contents: read
    uses: ./.github/workflows/build-linux.yml
    secrets: inherit

  release:
    runs-on: ubuntu-latest
    needs: [build_windows, build_macos, build_linux]
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.release_tag || github.ref_name }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download installer artifacts
        uses: actions/download-artifact@v4.1.3
        with:
          pattern: "*-installer"
          merge-multiple: true
          path: .artifacts

      - name: Prepare release metadata
        run: |
          python -m pip install -r requirements-build.txt
          python -m pip install -r requirements.txt
          python build-scripts/create_release.py --version "${RELEASE_TAG}"

      - name: Verify checksums
        run: (cd .artifacts && sha256sum -c SHA256SUMS.txt)

      - name: Ensure GitHub release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${RELEASE_TAG}" >/dev/null 2>&1 || \
          gh release create "${RELEASE_TAG}" --title "${RELEASE_TAG}" --notes "Automated installer release."

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: .artifacts/RELEASE_NOTES.md
          files: |
            .artifacts/TinForge-v2-Setup.exe
            .artifacts/TinForge-v2.dmg
            .artifacts/TinForge-v2.AppImage
            .artifacts/SHA256SUMS.txt
          overwrite_files: true
          fail_on_unmatched_files: true

      - name: Notify completion
        run: |
          echo "Release coordination complete for ${RELEASE_TAG}"
          echo "All platform installers uploaded with checksums."

name: Release

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: windows
          - os: macos-latest
            target: macos
          - os: ubuntu-latest
            target: linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-build.txt
      - run: pip install -r requirements.txt
      - run: python build_installer.py --platform ${{ matrix.target }}
      - name: Upload release artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          mapfile -t files < <(find dist -maxdepth 1 -type f)
          if [[ -f TinForge-v2-Setup.exe ]]; then
            files+=("TinForge-v2-Setup.exe")
          fi
          if [[ "${#files[@]}" -eq 0 ]]; then
            echo "No release artifacts found"
            exit 1
          fi
          gh release upload "$tag" "${files[@]}" --clobber

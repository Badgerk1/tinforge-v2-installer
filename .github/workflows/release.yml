name: Release Coordinator

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build_windows:
    uses: ./.github/workflows/build-windows.yml
    secrets: inherit

  build_macos:
    uses: ./.github/workflows/build-macos.yml
    secrets: inherit

  build_linux:
    uses: ./.github/workflows/build-linux.yml
    secrets: inherit

  release:
    runs-on: ubuntu-latest
    needs: [build_windows, build_macos, build_linux]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download installer artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "*-installer"
          merge-multiple: true
          path: .artifacts

      - name: Prepare release metadata
        run: |
          python -m pip install -r requirements-build.txt
          python -m pip install -r requirements.txt
          python build-scripts/create_release.py --version "${{ github.event.release.tag_name || github.ref_name }}"

      - name: Verify checksums
        run: (cd .artifacts && sha256sum -c SHA256SUMS.txt)

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          body_path: .artifacts/RELEASE_NOTES.md
          files: |
            .artifacts/TinForge-v2-Setup.exe
            .artifacts/TinForge-v2.dmg
            .artifacts/TinForge-v2.AppImage
            .artifacts/SHA256SUMS.txt
          overwrite_files: true
          fail_on_unmatched_files: true

      - name: Notify completion
        run: |
          echo "Release coordination complete for ${{ github.event.release.tag_name || github.ref_name }}"
          echo "All platform installers uploaded with checksums."

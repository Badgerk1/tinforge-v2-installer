name: Build Linux Installer

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [develop]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup build environment
        shell: bash
        run: bash .github/workflows/common/setup-build-env.sh linux

      - name: Build installer
        shell: bash
        run: |
          mkdir -p .artifacts/logs
          python build-scripts/build_linux.py 2>&1 | tee .artifacts/logs/build-linux.log

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-installer
          path: |
            .artifacts/TinForge-v2.AppImage
            .artifacts/logs/build-linux.log
